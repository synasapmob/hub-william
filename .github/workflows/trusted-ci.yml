name: CI

# Run the trusted workflow from the default branch. Community PRs are checked
# by contribution-policy without checking out or executing their code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Community PR policy tests
        run: node --test .github/scripts/contribution-policy.test.mjs

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tailwind classes are canonical
        run: pnpm check:tailwind

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Preserve config writes, model discovery and gateway proxy contracts.
      - name: Tool installer suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
        working-directory: apps/frontend/scripts/installers
