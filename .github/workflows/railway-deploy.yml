name: Deploy to Railway

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# `main` deploys production and `dev` deploys staging. Each environment keeps its
# own queue, so a staging deploy never waits for production.
concurrency:
  group: railway-${{ github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: >-
      github.repository == 'synasapmob/hub-william' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    timeout-minutes: 60
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: f7d4909b-9c94-4dc5-b416-be61b9943909
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # Staging has no Telegram adapter deployment.
      DEPLOY_SERVICES: ${{ github.ref_name == 'main' && 'api telegram frontend' || 'api frontend' }}

    steps:
      - name: Check Railway token
        id: credentials
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::RAILWAY_TOKEN is not configured; $DEPLOY_ENVIRONMENT was not deployed."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Railway CLI
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global @railway/cli@5.49.6

      - name: Deploy and verify services
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail

          deploy_service() {
            local service="$1"
            local result listing deployment_id status previous_status=""

            # With --json the CLI prints its errors on stdout, so show them here.
            result="$(railway up \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$DEPLOY_ENVIRONMENT" \
              --service "$service" \
              --message "${GITHUB_REF_NAME} ${GITHUB_SHA}" \
              --detach --json)" || {
              echo "::error::$service: railway up failed: ${result:-no output}"
              return 1
            }
            deployment_id="$(jq -er '.deploymentId' <<< "$result")" || {
              echo "::error::$service: no deployment id in the railway up output: $result"
              return 1
            }
            echo "$service queued as $deployment_id"

            for attempt in $(seq 1 90); do
              listing="$(railway deployment list \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$DEPLOY_ENVIRONMENT" \
                --service "$service" \
                --limit 100 --json)" || {
                echo "::error::$service: railway deployment list failed: ${listing:-no output}"
                return 1
              }
              status="$(jq -r --arg id "$deployment_id" '[.[] | select(.id == $id) | .status][0] // ""' <<< "$listing")"

              if [[ "$status" != "$previous_status" ]]; then
                echo "$service $deployment_id ($attempt/90): ${status:-waiting for deployment record}"
                previous_status="$status"
              fi

              case "$status" in
                SUCCESS) return 0 ;;
                FAILED|CRASHED|REMOVED|REMOVING|SKIPPED|NEEDS_APPROVAL|SLEEPING)
                  echo "::error::$service deployment $deployment_id ended with $status"
                  return 1
                  ;;
                ""|QUEUED|WAITING|INITIALIZING|BUILDING|DEPLOYING) sleep 10 ;;
                *)
                  echo "::error::$service deployment $deployment_id has unexpected status $status"
                  return 1
                  ;;
              esac
            done

            echo "::error::$service deployment $deployment_id did not finish within 15 minutes"
            return 1
          }

          for service in $DEPLOY_SERVICES; do
            deploy_service "$service"
          done
